; docker/php/php.ini
;
; Ucitava se kao /usr/local/etc/php/conf.d/99-syncops.ini
; (prefiks 99 znaci da dolazi posle svih podrazumevanih podesavanja).
;
; NAPOMENA: ovaj fajl je podesen za RAZVOJ. Za produkciju promeniti
; display_errors i opcache.validate_timestamps (oznaceno nize).

[PHP]

; --- Vreme ---------------------------------------------------------
; Sve u aplikaciji radi u UTC; konverzija u lokalnu zonu ide samo u prikazu.
date.timezone = UTC

; --- Greske --------------------------------------------------------
error_reporting = E_ALL

; RAZVOJ: greske se prikazuju u browseru.
; PRODUKCIJA: display_errors = Off
display_errors = On
display_startup_errors = On

; Logovanje ide na stderr kontejnera, da ga pokupi "docker compose logs".
log_errors = On
error_log = /dev/stderr

; --- Limiti --------------------------------------------------------
memory_limit = 256M

; Vazi samo za web zahteve. CLI (discovery, worker) nema ovo ogranicenje,
; sto je i razlog zasto discovery ide iskljucivo kroz CLI.
max_execution_time = 30
max_input_time = 30

post_max_size = 8M
upload_max_filesize = 8M

; --- Sesije --------------------------------------------------------
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; Ukljuciti kada aplikacija bude isla preko HTTPS-a:
; session.cookie_secure = 1

; --- OPcache -------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; RAZVOJ: izmene u kodu se odmah vide (bind mount).
; PRODUKCIJA: opcache.validate_timestamps = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; --- Razno ---------------------------------------------------------
; Ne otkrivaj verziju PHP-a u HTTP odgovorima.
expose_php = Off
