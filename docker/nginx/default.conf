# docker/nginx/default.conf
#
# Montira se kao /etc/nginx/conf.d/default.conf
# Document root je /app/public — ostatak repozitorijuma nije mountovan
# u web kontejner, pa src/, config/ i .env nisu dostupni ni greskom.

server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    charset utf-8;

    # Logovi na stdout/stderr kontejnera
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size 8m;

    # Osnovni security headeri
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # -----------------------------------------------------------------
    # Front controller: sve sto nije postojeci fajl ide na index.php
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # -----------------------------------------------------------------
    # PHP se izvrsava SAMO kroz index.php.
    # Ovim se sprecava izvrsavanje bilo kog drugog .php fajla koji bi se
    # nasao pod public/ (npr. slucajno kopiran ili uploadovan).
    # -----------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # Putanja mora odgovarati onoj koju vidi php-fpm kontejner:
        # web mountuje ./public na /app/public, app mountuje . na /app.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 60s;

        internal;
    }

    # Svaki drugi .php zahtev -> 404, ne izvrsava se
    location ~ \.php$ {
        return 404;
    }

    # -----------------------------------------------------------------
    # Staticki sadrzaj
    # -----------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Skriveni fajlovi (.env, .git, .htaccess ...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }
}
